[package]
name = "fontpm-new"
description = """
A package-manager like tool to install fonts.
"""
publish = false
repository = "https://github.com/tecc/fontpm"
keywords = ["fontpm", "fonts"]
categories = ["command-line-utilities", "multimedia", "web-programming"]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"

[dependencies]
async-trait = "0.1.68"
clap = { version = "4.2.2", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.8"
futures = "0.3.25"
lazy_static = "1.4.0"
multimap = "0.10.1"
paris = "1.5.13"
path-calculate = "0.1.3"
path-clean = "1.0.1"
semver = "1.0.16"
serde = { version = "1.0.151", features = ["derive"] }
termcolor = "1.1.3"
tokio = { version = "1.23.0", features = ["full"] }
toml = "0.9.8"

[features]
default = ["source-google-fonts"]
source-google-fonts = []